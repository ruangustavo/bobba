[workspace]
resolver = "3"
members = ["crates/protocol", "crates/session", "crates/extensions", "crates/sulek", "crates/app", "crates/intercept", "crates/bench"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
bytes = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
dirs = "6"
getrandom = "0.3"
rayon = "1"
tempfile = "3"
bobba-extensions = { path = "crates/extensions" }
bobba-sulek = { path = "crates/sulek" }
bobba-intercept = { path = "crates/intercept" }
rune = { git = "https://github.com/anomalyco/rune", rev = "0ca3fd741192fa6e79e6da057e513c8cfd1b4669", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "0ca3fd741192fa6e79e6da057e513c8cfd1b4669", default-features = false }
libc = "0.2"
mach2 = "0.7"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_System_Threading"] }
bobba-protocol = { path = "crates/protocol" }
bobba-session = { path = "crates/session" }

[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "0ca3fd741192fa6e79e6da057e513c8cfd1b4669" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "0ca3fd741192fa6e79e6da057e513c8cfd1b4669" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "0ca3fd741192fa6e79e6da057e513c8cfd1b4669" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "0ca3fd741192fa6e79e6da057e513c8cfd1b4669" }
naga = { git = "https://github.com/anomalyco/rune", rev = "0ca3fd741192fa6e79e6da057e513c8cfd1b4669" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "0ca3fd741192fa6e79e6da057e513c8cfd1b4669" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "0ca3fd741192fa6e79e6da057e513c8cfd1b4669" }
accesskit_atspi_common = { git = "https://github.com/anomalyco/rune", rev = "0ca3fd741192fa6e79e6da057e513c8cfd1b4669" }
