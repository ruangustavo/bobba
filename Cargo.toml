[workspace]
resolver = "3"
members = ["crates/protocol", "crates/session", "crates/extensions"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
bytes = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tokio-util = "0.7"
bobba-protocol = { path = "crates/protocol" }
bobba-session = { path = "crates/session" }
